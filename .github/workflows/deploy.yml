name: Deploy Bots

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          cd /opt/uptime-studio-site
          git pull origin main

      - name: Restart Docker containers
        run: |
          cd /opt/uptime-studio-site
          docker-compose pull
          docker-compose up -d
